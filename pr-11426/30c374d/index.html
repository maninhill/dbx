<main><h1>#11426 界面预览</h1><p class="m">commit 30c374d · <a href="https://github.com/t8y2/dbx/pull/11426">回到 PR</a> · 这次改动只影响手动事务提交完成后的会话清理逻辑：如果用户在提交尚未返回时切换了模式/目标并开启了新的事务，旧提交结束时不再误删新事务会话和脏标记。界面上可观察的点是：事务状态在目标切换后提交完成时应保留为新会话，而不是回到空状态。</p>
