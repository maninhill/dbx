<main><h1>#11389 界面预览</h1><p class="m">commit 41ef9d9 · <a href="https://github.com/t8y2/dbx/pull/11389">回到 PR</a> · 这次修改把 OceanBase Oracle 也纳入了 Oracle 风格的 ROWID 处理：查询结果映射、隐藏主键补投影、以及可编辑结果的行标识绑定都会按 `ROWIDTOCHAR(ROWID)` / `__DBX_ROWID` 规则工作，避免把内部列当成物理列投影。对显式选出的 ROWID、物理 `rowid` 列、以及已有真实主键的情况也补了边界处理。</p>
